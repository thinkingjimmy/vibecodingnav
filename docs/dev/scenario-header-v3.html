<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>场景页头部 · 第三轮</title>
<script>if(/[?&]theme=dark/.test(location.search))document.documentElement.classList.add('dark')</script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#09090b;--muted:#f4f4f5;--mfg:#71717a;--faint:#a1a1aa;--border:#e4e4e7;--line:color-mix(in oklab,#e4e4e7 64%,#fff);--surface:#fafafa}
.dark{--bg:#09090b;--fg:#fafafa;--muted:#27272a;--mfg:#a1a1aa;--faint:#71717a;--border:#27272a;--line:color-mix(in oklab,#27272a 64%,#09090b);--surface:#111113}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Geist,'Noto Sans CJK SC',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.ph{width:1em;height:1em;display:inline-block;vertical-align:-.125em;flex:none}
.num{font-family:'Geist Mono','Noto Sans CJK SC',monospace;font-feature-settings:"tnum" 1,"zero" 1}
.opt{position:relative;border-bottom:8px solid var(--muted);overflow:hidden;padding-bottom:72px}
.col{max-width:1200px;margin:0 auto;padding:0 16px}
.tag{position:absolute;left:16px;top:14px;font:500 11px/1 'Geist Mono',monospace;color:var(--faint)}
.bc{padding-top:56px;font-size:12px;color:var(--mfg)}.bc b{color:var(--fg);font-weight:400}
h1{font-size:48px;line-height:1.08;font-weight:500;letter-spacing:-.04em;margin-top:22px}
h2{font-size:22px;font-weight:500;letter-spacing:-.02em}
.lead{margin-top:16px;font-size:17px;line-height:1.6;color:var(--mfg)}
.key{margin-top:6px;font-size:17px;line-height:1.6;color:var(--fg)}
.key .lg{margin:0 4px 0 2px}
.meta{font-size:12px;color:var(--faint)}
.u{text-decoration:underline;text-decoration-color:color-mix(in oklab,currentColor 30%,transparent);text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;background:var(--muted);font-size:13px;font-weight:500}
.lg{display:inline-grid;place-items:center;width:14px;height:14px;vertical-align:-2px}.lg svg{width:14px;height:14px}
/* table */
.g{display:grid;grid-template-columns:1fr 104px 64px repeat(5,124px);align-items:center;column-gap:8px}
.th{height:40px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mfg)}
.th>span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.th .cv{color:var(--faint);font-size:11px}
.th .on{color:var(--fg);font-weight:500}
.tr{height:48px;border-bottom:1px solid var(--line);font-size:14px}
.tr .m{display:flex;align-items:center;gap:10px;font-weight:500}
.tr .sc{font-weight:500}
.dash{color:var(--faint)}
.more{height:44px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--mfg);border-bottom:1px solid var(--line)}
.infob{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:var(--faint)}
.infob.hot{color:var(--fg);background:var(--muted)}
.pop{position:absolute;top:30px;left:-14px;width:300px;z-index:5;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:12px 14px;box-shadow:0 12px 32px -16px rgba(0,0,0,.3);font-size:13px;line-height:1.6;color:var(--mfg);white-space:normal;font-weight:400;text-align:left}
.pop b{display:block;color:var(--fg);font-weight:500;margin-bottom:4px}
.pop .ws{display:flex;gap:2px;margin:10px 0 4px}.pop .ws i{height:5px;border-radius:1px;background:var(--fg)}
.pop .wl{display:flex;gap:2px;font:10.5px 'Geist Mono',monospace;color:var(--faint)}.pop .wl span{white-space:nowrap;overflow:hidden}
.pop a{display:inline-flex;align-items:center;gap:4px;margin-top:8px;color:var(--fg);font-weight:500}
.toolbar{display:flex;align-items:center;justify-content:space-between;height:44px;font-size:13px;color:var(--mfg)}
.toolbar .q{display:inline-flex;align-items:center;gap:5px;color:var(--fg)}
.sep{color:var(--border);margin:0 8px}
/* combo */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:var(--bg);white-space:nowrap}
.chip .ph{color:var(--mfg)}
.chip .t{font:11px 'Geist Mono','Noto Sans CJK SC',monospace;color:var(--faint)}
.chip.main{border-color:color-mix(in oklab,var(--fg) 35%,var(--border));font-weight:500}
.plus{align-self:center;color:var(--faint);font-size:13px}
.stack{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border-top:1px solid var(--line)}
.stack .c{padding:14px 16px 14px 0;border-bottom:1px solid var(--line)}
.stack .t{font:11px 'Geist Mono','Noto Sans CJK SC',monospace;color:var(--faint);display:flex;align-items:center;gap:6px}
.stack .n{margin-top:6px;font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.stack .y{margin-top:2px;font-size:12.5px;color:var(--mfg)}
/* method section */
.wbar{display:flex;gap:4px;margin-top:22px;max-width:1200px}
.wseg .lab{font-size:13px;font-weight:500;white-space:nowrap}.wseg .lab span{font:11px 'Geist Mono',monospace;color:var(--faint);margin-left:4px;font-weight:400}
.wseg .bar{height:6px;border-radius:2px;background:var(--fg);margin-top:8px;opacity:.85}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:22px;max-width:960px}
.rules div{font-size:13.5px;line-height:1.6;color:var(--mfg)}.rules b{display:block;color:var(--fg);font-weight:500;font-size:13.5px;margin-bottom:2px}
/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:460px;background:var(--bg);border-left:1px solid var(--border);box-shadow:-24px 0 48px -32px rgba(0,0,0,.3);padding:28px 28px;z-index:10;overflow:hidden}
.scrim{position:absolute;inset:0;background:color-mix(in oklab,var(--fg) 6%,transparent);z-index:9}
.drawer h3{font-size:20px;font-weight:500;letter-spacing:-.02em}
.drawer .sec{margin-top:22px}.drawer .sec h4{font-size:12px;font-weight:500;color:var(--faint);font-family:'Geist Mono',monospace;margin-bottom:8px}
.drawer p,.drawer li{font-size:13.5px;line-height:1.65;color:var(--mfg)}
.drawer ul{list-style:none}.drawer li{padding-left:14px;position:relative;margin-top:4px}.drawer li::before{content:"";position:absolute;left:2px;top:.75em;width:4px;height:1px;background:var(--faint)}
.wt{display:grid;grid-template-columns:1fr 48px;font-size:13.5px}.wt span{padding:6px 0;border-top:1px solid var(--line)}.wt span:nth-child(even){text-align:right;font-family:'Geist Mono',monospace}
.wt span:nth-child(-n+2){border-top:0}
.formula{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:12px/1.7 'Geist Mono','Noto Sans CJK SC',monospace;color:var(--fg)}
