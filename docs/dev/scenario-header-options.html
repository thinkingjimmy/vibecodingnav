.dark{--bg:#09090b;--fg:#fafafa;--muted:#27272a;--mfg:#a1a1aa;--faint:#71717a;--border:#27272a;--line:color-mix(in oklab,#27272a 64%,#09090b);--surface:#111113}

body{background:var(--bg);color:var(--fg);font:15px/1.5 Geist,'Noto Sans CJK SC',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.opt{position:relative;border-bottom:8px solid var(--muted);overflow:hidden}
.col{max-width:1200px;margin:0 auto;padding:0 16px}
.tag{position:absolute;left:16px;top:14px;font:500 11px/1 'Geist Mono',monospace;color:var(--faint)}

.meta{font-size:12px;color:var(--faint)}
.link-u{text-decoration:underline;text-decoration-color:color-mix(in oklab,currentColor 30%,transparent);text-underline-offset:3px}

.chip .w{font:500 11px 'Geist Mono',monospace;color:var(--faint)}
.chip.on{border-color:color-mix(in oklab,var(--fg) 30%,var(--border))}
.pop{position:absolute;left:0;top:40px;width:280px;z-index:4;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:12px 14px;box-shadow:0 12px 32px -16px rgba(0,0,0,.25);font-size:13px;line-height:1.55;color:var(--mfg)}
.pop b{display:block;color:var(--fg);font-weight:500;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;background:var(--muted);font-size:13px;font-weight:500}

.combo .k{font-weight:500}.combo .v{color:var(--mfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.combo .go{margin-left:auto;color:var(--faint);white-space:nowrap}

.tbl{margin-top:20px}
.g{display:grid;grid-template-columns:1fr 96px 72px repeat(5,112px);align-items:center;column-gap:8px}
.th{height:40px;border-bottom:1px solid var(--line);font-size:12px;color:var(--faint)}
.th span:not(:first-child),.tr span:not(:first-child){text-align:right}
.th .bn{font-family:'Geist Mono',monospace;font-size:12px}
.tr{height:48px;border-bottom:1px solid var(--line);font-size:14px}
.tr .m{display:flex;align-items:center;gap:10px;font-weight:500}
.lg{display:inline-grid;place-items:center;width:14px;height:14px}.lg svg{width:14px;height:14px}
.fade{height:40px;background:linear-gradient(var(--bg),transparent)}

.sm .hl .bars i.r{background:var(--fg)}
